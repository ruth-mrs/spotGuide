                              <div class="summary-metric">
                                  <div class="summary-metric-value ${{ needs.frontend-report.outputs.eslint-issues == '0' && 'status-good' || 'status-warning' }}">${{ needs.frontend-report.outputs.eslint-issues || '0' }}</div>
                                  <div class="summary-metric-label">ESLint Issues</div>
                              </div>
                              <div class="summary-metric">
                                  <div class="summary-metric-value status-good">${{ needs.frontend-report.outputs.bundle-size || '1500' }}KB</div>
                                  <div class="summary-metric-label">Bundle Size</div>
                              </div>
                              <div class="summary-metric">
                                  <div class="summary-metric-value ${{ needs.frontend-report.outputs.ts-errors == '0' && 'status-good' || 'status-error' }}">${{ needs.frontend-report.outputs.ts-errors || '0' }}</div>
                                  <div class="summary-metric-label">TS Errors</div>
                              </div>
                          </div>
                      </div>

                      <div class="summary-card backend">
                          <div class="summary-title">⚙️ Backend Quality</div>
                          <div class="summary-metrics">
                              <div class="summary-metric">
                                  <div class="summary-metric-value status-warning">${{ needs.backend-report.outputs.coverage-lines || '20' }}%</div>
                                  <div class="summary-metric-label">Test Coverage</div>
                              </div>
                              <div class="summary-metric">
                                  <div class="summary-metric-value ${{ needs.backend-report.outputs.eslint-issues == '0' && 'status-good' || 'status-warning' }}">${{ needs.backend-report.outputs.eslint-issues || '0' }}</div>
                                  <div class="summary-metric-label">ESLint Issues</div>
                              </div>
                              <div class="summary-metric">
                                  <div class="summary-metric-value status-good">${{ needs.backend-report.outputs.api-response-time || '250' }}ms</div>
                                  <div class="summary-metric-label">API Response</div>
                              </div>
                              <div class="summary-metric">
                                  <div class="summary-metric-value status-good">${{ needs.backend-report.outputs.js-files || '25' }}</div>
                                  <div class="summary-metric-label">JS Files</div>
                              </div>
