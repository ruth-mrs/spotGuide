name: 📊 Quality Reports Generator

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Ejecutar diariamente a las 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      report_scope:
        description: 'Alcance del informe'
        required: true
        default: 'both'
        type: choice
        options:
        - both
        - frontend-only
        - backend-only

env:
  NODE_VERSION: '20'
  REPORT_ID: ${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  # ================================================================
  # 📊 FRONTEND QUALITY REPORT
  # ================================================================
  frontend-report:
    if: ${{ inputs.report_scope == 'both' || inputs.report_scope == 'frontend-only' || inputs.report_scope == '' }}
    runs-on: ubuntu-latest
    name: 🎨 Frontend Quality Report

    outputs:
      coverage-lines: ${{ steps.metrics.outputs.coverage-lines }}
      eslint-issues: ${{ steps.metrics.outputs.eslint-issues }}
      bundle-size: ${{ steps.metrics.outputs.bundle-size }}
      ts-errors: ${{ steps.metrics.outputs.ts-errors }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm install -g @ionic/cli @angular/cli

      - name: 📁 Create Reports Directory
        working-directory: ./frontend
        run: mkdir -p reports

      # ===============================
      # 🔍 CODE ANALYSIS
      # ===============================
      - name: 🔍 ESLint Analysis
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "🔍 Running ESLint analysis..."
          
          # Run ESLint with multiple formats
          npx eslint src/ --ext .ts,.html --format json --output-file reports/eslint-report.json || true
          npx eslint src/ --ext .ts,.html --format html --output-file reports/eslint-report.html || true
          
          # Generate summary
          echo "📊 Generating ESLint metrics..."
          TOTAL_FILES=$(find src -name "*.ts" -o -name "*.html" | wc -l)
          ESLINT_ISSUES=$(cat reports/eslint-report.json | jq '[.[] | .messages[]] | length' 2>/dev/null || echo "0")
          ESLINT_ERRORS=$(cat reports/eslint-report.json | jq '[.[] | .messages[] | select(.severity == 2)] | length' 2>/dev/null || echo "0")
          ESLINT_WARNINGS=$(cat reports/eslint-report.json | jq '[.[] | .messages[] | select(.severity == 1)] | length' 2>/dev/null || echo "0")
          
          echo "total-files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "eslint-issues=$ESLINT_ISSUES" >> $GITHUB_OUTPUT
          echo "eslint-errors=$ESLINT_ERRORS" >> $GITHUB_OUTPUT
          echo "eslint-warnings=$ESLINT_WARNINGS" >> $GITHUB_OUTPUT

      - name: 📊 TypeScript Compiler Check
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "📊 Checking TypeScript compilation..."
          npx tsc --noEmit --skipLibCheck > reports/typescript-errors.txt 2>&1 || true
          
          TS_ERRORS=$(grep -c "error TS" reports/typescript-errors.txt || echo "0")
          echo "ts-errors=$TS_ERRORS" >> $GITHUB_OUTPUT

      # ===============================
      # 🧪 TESTING & COVERAGE
      # ===============================
      - name: 🧪 Run Tests with Coverage
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "🧪 Running unit tests with coverage..."
          
          # Configure Chrome for headless testing
          export CHROME_BIN=chromium-browser
          
          # Run tests with coverage
          npm run test -- --no-watch --code-coverage --browsers=ChromeHeadless || true
          
          # Copy coverage reports
          if [ -d "coverage" ]; then
            cp -r coverage reports/
            
            # Extract coverage metrics
            if [ -f "coverage/lcov-report/index.html" ]; then
              COVERAGE_LINES=$(grep -o "Lines</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              COVERAGE_FUNCTIONS=$(grep -o "Functions</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              COVERAGE_BRANCHES=$(grep -o "Branches</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              
              echo "coverage-lines=$COVERAGE_LINES" >> $GITHUB_OUTPUT
              echo "coverage-functions=$COVERAGE_FUNCTIONS" >> $GITHUB_OUTPUT
              echo "coverage-branches=$COVERAGE_BRANCHES" >> $GITHUB_OUTPUT
            fi
          fi

      # ===============================
      # 🏗️ BUILD & BUNDLE ANALYSIS
      # ===============================
      - name: 🏗️ Build Application
        working-directory: ./frontend
        run: |
          echo "🏗️ Building application..."
          ionic build --prod

      - name: 📦 Bundle Size Analysis
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "📦 Analyzing bundle size..."
          
          # Calculate bundle sizes
          TOTAL_SIZE=$(du -sb www/ | cut -f1)
          JS_SIZE=$(find www -name "*.js" -exec stat -c%s {} \; | awk '{sum+=$1} END {print sum}')
          CSS_SIZE=$(find www -name "*.css" -exec stat -c%s {} \; | awk '{sum+=$1} END {print sum}')
          
          # Convert to KB
          TOTAL_SIZE_KB=$((TOTAL_SIZE / 1024))
          JS_SIZE_KB=$((JS_SIZE / 1024))
          CSS_SIZE_KB=$((CSS_SIZE / 1024))
          
          echo "bundle-size=$TOTAL_SIZE_KB" >> $GITHUB_OUTPUT
          echo "js-size=$JS_SIZE_KB" >> $GITHUB_OUTPUT
          echo "css-size=$CSS_SIZE_KB" >> $GITHUB_OUTPUT
          
          # Generate bundle report
          du -sh www/ > reports/bundle-size.txt
          find www -name "*.js" -exec ls -lh {} \; | sort -k5 -hr > reports/js-files-size.txt

      # ===============================
      # 🔒 SECURITY AUDIT
      # ===============================
      - name: 🔒 Security Audit
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "🔒 Running security audit..."
          
          npm audit --json > reports/npm-audit.json || true
          npm audit > reports/npm-audit.txt || true
          
          # Count vulnerabilities
          CRITICAL_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          HIGH_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
          MODERATE_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo "0")
          
          echo "security-critical=$CRITICAL_VULNS" >> $GITHUB_OUTPUT
          echo "security-high=$HIGH_VULNS" >> $GITHUB_OUTPUT
          echo "security-moderate=$MODERATE_VULNS" >> $GITHUB_OUTPUT

      # ===============================
      # 📊 GENERATE FRONTEND REPORT
      # ===============================
      - name: 📊 Generate Frontend Quality Report
        id: metrics
        working-directory: ./frontend
        run: |
          # Extract all metrics for output
          echo "coverage-lines=${COVERAGE_LINES:-0}" >> $GITHUB_OUTPUT
          echo "eslint-issues=${ESLINT_ISSUES:-0}" >> $GITHUB_OUTPUT
          echo "bundle-size=${TOTAL_SIZE_KB:-0}" >> $GITHUB_OUTPUT
          echo "ts-errors=${TS_ERRORS:-0}" >> $GITHUB_OUTPUT
          
          cat > reports/frontend-quality-report.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>SpotGuide Frontend - Quality Report</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { 
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { 
                      max-width: 1200px; 
                      margin: 0 auto; 
                      background: white; 
                      border-radius: 16px; 
                      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                      overflow: hidden;
                  }
                  .header { 
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                      color: white; 
                      padding: 40px; 
                      text-align: center; 
                  }
                  .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
                  .header .subtitle { opacity: 0.9; font-size: 1.2rem; }
                  .header .meta { margin-top: 20px; opacity: 0.8; }
                  
                  .metrics-grid { 
                      display: grid; 
                      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
                      gap: 20px; 
                      padding: 40px; 
                      background: #f8fafc;
                  }
                  .metric-card { 
                      background: white; 
                      padding: 30px; 
                      border-radius: 12px; 
                      text-align: center; 
                      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
                      border: 1px solid #e2e8f0;
                  }
                  .metric-value { 
                      font-size: 3rem; 
                      font-weight: bold; 
                      margin-bottom: 10px; 
                  }
                  .metric-label { 
                      color: #64748b; 
                      font-size: 1.1rem;
                      margin-bottom: 5px;
                  }
                  .metric-description { 
                      color: #94a3b8; 
                      font-size: 0.9rem; 
                  }
                  
                  .status-good { color: #10b981; }
                  .status-warning { color: #f59e0b; }
                  .status-error { color: #ef4444; }
                  
                  .section { 
                      padding: 40px; 
                      border-bottom: 1px solid #e2e8f0; 
                  }
                  .section h2 { 
                      font-size: 1.8rem; 
                      margin-bottom: 20px; 
                      color: #1e293b;
                  }
                  .report-links { 
                      display: grid; 
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
                      gap: 15px; 
                  }
                  .report-link { 
                      display: block; 
                      padding: 20px; 
                      background: #f1f5f9; 
                      border: 1px solid #e2e8f0; 
                      border-radius: 8px; 
                      text-decoration: none; 
                      color: #475569; 
                      text-align: center; 
                      transition: all 0.2s ease; 
                  }
                  .report-link:hover { 
                      background: #e2e8f0; 
                      border-color: #cbd5e1; 
                      transform: translateY(-2px);
                  }
                  
                  .file-structure { 
                      background: #f8fafc; 
                      padding: 20px; 
                      border-radius: 8px; 
                      font-family: 'Courier New', monospace; 
                      color: #334155;
                      line-height: 1.6;
                  }
                  
                  .recommendations { 
                      background: #fef3c7; 
                      border: 1px solid #fbbf24; 
                      border-radius: 8px; 
                      padding: 20px; 
                  }
                  .recommendations ul { 
                      list-style: none; 
                      padding: 0; 
                  }
                  .recommendations li { 
                      padding: 8px 0; 
                      border-bottom: 1px solid rgba(251, 191, 36, 0.2); 
                  }
                  .recommendations li:last-child { 
                      border-bottom: none; 
                  }
                  
                  .footer { 
                      text-align: center; 
                      padding: 30px; 
                      color: #94a3b8; 
                      background: #f8fafc;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🎨 SpotGuide Frontend</h1>
                      <div class="subtitle">Quality & Performance Report</div>
                      <div class="meta">
                          📅 Generated: $(date '+%d/%m/%Y %H:%M:%S') | 
                          🔖 Commit: ${GITHUB_SHA:0:7} | 
                          🏗️ Build #${GITHUB_RUN_NUMBER}
                      </div>
                  </div>

                  <div class="metrics-grid">
                      <div class="metric-card">
                          <div class="metric-value status-warning">${COVERAGE_LINES:-0}%</div>
                          <div class="metric-label">Test Coverage</div>
                          <div class="metric-description">Lines covered by tests</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${ESLINT_ISSUES:-0 == 0 ? 'status-good' : ESLINT_ISSUES < 10 ? 'status-warning' : 'status-error'}">${ESLINT_ISSUES:-0}</div>
                          <div class="metric-label">ESLint Issues</div>
                          <div class="metric-description">${ESLINT_ERRORS:-0} errors, ${ESLINT_WARNINGS:-0} warnings</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${TOTAL_SIZE_KB:-0 < 2048 ? 'status-good' : TOTAL_SIZE_KB < 4096 ? 'status-warning' : 'status-error'}">${TOTAL_SIZE_KB:-0}KB</div>
                          <div class="metric-label">Bundle Size</div>
                          <div class="metric-description">Total application size</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${TS_ERRORS:-0 == 0 ? 'status-good' : 'status-error'}">${TS_ERRORS:-0}</div>
                          <div class="metric-label">TypeScript Errors</div>
                          <div class="metric-description">Compilation errors</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${CRITICAL_VULNS:-0 == 0 ? 'status-good' : 'status-error'}">${CRITICAL_VULNS:-0}</div>
                          <div class="metric-label">Critical Vulnerabilities</div>
                          <div class="metric-description">${HIGH_VULNS:-0} high, ${MODERATE_VULNS:-0} moderate</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value status-good">$(find src -name "*.ts" | wc -l)</div>
                          <div class="metric-label">TypeScript Files</div>
                          <div class="metric-description">Total source files</div>
                      </div>
                  </div>

                  <div class="section">
                      <h2>📁 Project Structure</h2>
                      <div class="file-structure">
          src/app/<br>
          ├── 📁 components/ ($(find src/app/components -name "*.ts" 2>/dev/null | wc -l) files)<br>
          ├── 📁 pages/ ($(find src/app/pages -name "*.ts" 2>/dev/null | wc -l) files)<br>
          ├── 📁 services/ ($(find src/app/services -name "*.ts" 2>/dev/null | wc -l) files)<br>
          ├── 📁 guards/ ($(find src/app/guards -name "*.ts" 2>/dev/null | wc -l) files)<br>
          └── 📁 shared/ ($(find src/app/shared -name "*.ts" 2>/dev/null | wc -l) files)<br>
          <br>
          📊 Total TypeScript: $(find src -name "*.ts" | wc -l) files<br>
          📊 Total SCSS: $(find src -name "*.scss" | wc -l) files<br>
          📊 Total Templates: $(find src -name "*.html" | wc -l) files<br>
          📊 Lines of Code: $(find src -name "*.ts" -exec cat {} \; | wc -l) LOC
                      </div>
                  </div>

                  <div class="section">
                      <h2>📊 Detailed Reports</h2>
                      <div class="report-links">
                          <a href="eslint-report.html" class="report-link">🔍 ESLint Analysis</a>
                          <a href="coverage/lcov-report/index.html" class="report-link">🧪 Test Coverage</a>
                          <a href="bundle-size.txt" class="report-link">📦 Bundle Analysis</a>
                          <a href="typescript-errors.txt" class="report-link">📊 TypeScript Errors</a>
                          <a href="npm-audit.txt" class="report-link">🔒 Security Audit</a>
                      </div>
                  </div>

                  <div class="section">
                      <h2>💡 Improvement Recommendations</h2>
                      <div class="recommendations">
                          <ul>
                              <li>🧪 <strong>Testing:</strong> Increase coverage from ${COVERAGE_LINES:-0}% to 75%</li>
                              <li>📦 <strong>Bundle:</strong> Implement lazy loading to reduce initial size</li>
                              <li>🔍 <strong>Code Quality:</strong> Fix ${ESLINT_ISSUES:-0} ESLint issues</li>
                              <li>🔒 <strong>Security:</strong> Update dependencies with vulnerabilities</li>
                              <li>⚡ <strong>Performance:</strong> Optimize images and implement service worker</li>
                              <li>📱 <strong>Mobile:</strong> Test responsive design on various devices</li>
                          </ul>
                      </div>
                  </div>

                  <div class="footer">
                      Generated automatically by GitHub Actions • SpotGuide Quality System
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: 📤 Upload Frontend Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports-${{ env.REPORT_ID }}
          path: |
            ./frontend/reports/
          retention-days: 30

  # ================================================================
  # 📊 BACKEND QUALITY REPORT
  # ================================================================
  backend-report:
    if: ${{ inputs.report_scope == 'both' || inputs.report_scope == 'backend-only' || inputs.report_scope == '' }}
    runs-on: ubuntu-latest
    name: ⚙️ Backend Quality Report

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017

    outputs:
      coverage-lines: ${{ steps.metrics.outputs.coverage-lines }}
      eslint-issues: ${{ steps.metrics.outputs.eslint-issues }}
      api-response-time: ${{ steps.metrics.outputs.api-response-time }}
      js-files: ${{ steps.metrics.outputs.js-files }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 📁 Create Reports Directory
        working-directory: ./backend
        run: mkdir -p reports

      # ===============================
      # 🔍 CODE ANALYSIS
      # ===============================
      - name: 🔍 ESLint Analysis
        working-directory: ./backend
        continue-on-error: true
        run: |
          echo "🔍 Running ESLint analysis..."
          
          # Create ESLint config if not exists
          if [ ! -f ".eslintrc.js" ]; then
            cat > .eslintrc.js << 'EOF'
          module.exports = {
            env: {
              browser: false,
              commonjs: true,
              es2021: true,
              node: true,
              jest: true
            },
            extends: ['standard'],
            parserOptions: {
              ecmaVersion: 12
            },
            rules: {
              'no-console': 'warn',
              'no-unused-vars': ['error', { 'argsIgnorePattern': '^_' }]
            },
            ignorePatterns: ['node_modules/', 'coverage/', '*.min.js']
          }
          EOF
          fi
          
          # Run ESLint
          npx eslint . --ext .js --format json --output-file reports/eslint-report.json || true
          npx eslint . --ext .js --format html --output-file reports/eslint-report.html || true
          
          # Calculate metrics
          TOTAL_JS_FILES=$(find . -name "*.js" -not -path "./node_modules/*" | wc -l)
          ESLINT_ISSUES=$(cat reports/eslint-report.json | jq '[.[] | .messages[]] | length' 2>/dev/null || echo "0")
          ESLINT_ERRORS=$(cat reports/eslint-report.json | jq '[.[] | .messages[] | select(.severity == 2)] | length' 2>/dev/null || echo "0")
          ESLINT_WARNINGS=$(cat reports/eslint-report.json | jq '[.[] | .messages[] | select(.severity == 1)] | length' 2>/dev/null || echo "0")
          
          echo "js-files=$TOTAL_JS_FILES" >> $GITHUB_OUTPUT
          echo "eslint-issues=$ESLINT_ISSUES" >> $GITHUB_OUTPUT
          echo "eslint-errors=$ESLINT_ERRORS" >> $GITHUB_OUTPUT
          echo "eslint-warnings=$ESLINT_WARNINGS" >> $GITHUB_OUTPUT

      # ===============================
      # 🧪 TESTING & COVERAGE
      # ===============================
      - name: 🧪 Run Tests with Coverage
        working-directory: ./backend
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/spotguide_test
          JWT_SECRET: test_jwt_secret_for_github_actions
        run: |
          echo "🧪 Running unit tests with coverage..."
          
          # Create Jest config if not exists
          if [ ! -f "jest.config.js" ]; then
            cat > jest.config.js << 'EOF'
          module.exports = {
            testEnvironment: 'node',
            collectCoverageFrom: [
              '**/*.js',
              '!**/node_modules/**',
              '!**/coverage/**',
              '!**/*.config.js'
            ],
            coverageDirectory: 'coverage',
            coverageReporters: ['text', 'lcov', 'html', 'json'],
            testTimeout: 30000
          };
          EOF
          fi
          
          # Run tests
          npm test -- --coverage --coverageDirectory=coverage || true
          
          # Copy coverage reports
          if [ -d "coverage" ]; then
            cp -r coverage reports/
            
            # Extract coverage metrics
            if [ -f "coverage/lcov-report/index.html" ]; then
              COVERAGE_LINES=$(grep -o "Lines</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              COVERAGE_FUNCTIONS=$(grep -o "Functions</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              COVERAGE_BRANCHES=$(grep -o "Branches</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              
              echo "coverage-lines=$COVERAGE_LINES" >> $GITHUB_OUTPUT
              echo "coverage-functions=$COVERAGE_FUNCTIONS" >> $GITHUB_OUTPUT
              echo "coverage-branches=$COVERAGE_BRANCHES" >> $GITHUB_OUTPUT
            fi
          fi

      # ===============================
      # ⚡ API PERFORMANCE TEST
      # ===============================
      - name: ⚡ API Performance Test
        working-directory: ./backend
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/spotguide_test
          JWT_SECRET: test_jwt_secret_for_github_actions
          PORT: 3001
        run: |
          echo "⚡ Testing API performance..."
          
          # Start server in background
          npm start &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 15
          
          # Create curl format for metrics
          cat > curl-format.txt << 'EOF'
          {
            "time_total": %{time_total},
            "time_connect": %{time_connect},
            "time_starttransfer": %{time_starttransfer},
            "http_code": %{http_code}
          }
          EOF
          
          # Test endpoints
          curl -w "@curl-format.txt" -o /dev/null -s http://localhost:3001/api/health > reports/perf-health.json || echo '{"error": "endpoint not available"}' > reports/perf-health.json
          
          # Stop server
          kill $SERVER_PID || true
          
          # Extract performance metrics
          HEALTH_TIME=$(cat reports/perf-health.json | jq '.time_total' 2>/dev/null || echo "0")
          HEALTH_TIME_MS=$(echo "$HEALTH_TIME * 1000" | bc 2>/dev/null | cut -d. -f1 || echo "250")
          
          echo "api-response-time=$HEALTH_TIME_MS" >> $GITHUB_OUTPUT

      # ===============================
      # 🔒 SECURITY AUDIT
      # ===============================
      - name: 🔒 Security Audit
        working-directory: ./backend
        continue-on-error: true
        run: |
          echo "🔒 Running security audit..."
          
          npm audit --json > reports/npm-audit.json || true
          npm audit > reports/npm-audit.txt || true
          
          # Count vulnerabilities
          CRITICAL_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          HIGH_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
          MODERATE_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo "0")
          
          echo "security-critical=$CRITICAL_VULNS" >> $GITHUB_OUTPUT
          echo "security-high=$HIGH_VULNS" >> $GITHUB_OUTPUT
          echo "security-moderate=$MODERATE_VULNS" >> $GITHUB_OUTPUT

      # ===============================
      # 📚 API DOCUMENTATION
      # ===============================
      - name: 📚 Generate API Documentation
        working-directory: ./backend
