                  .report-link:hover { 
                      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
                      transform: translateY(-3px);
                      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
                  }
                  .report-link.frontend { border-left: 4px solid #667eea; }
                  .report-link.backend { border-left: 4px solid #16a34a; }
                  
                  .footer { 
