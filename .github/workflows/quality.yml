          ├── 📁 services/ ($(find src/app/services -name "*.ts" 2>/dev/null | wc -l) files)<br>
          ├── 📁 guards/ ($(find src/app/guards -name "*.ts" 2>/dev/null | wc -l) files)<br>
          └── 📁 shared/ ($(find src/app/shared -name "*.ts" 2>/dev/null | wc -l) files)<br>
          <br>
          📊 Total TypeScript: $(find src -name "*.ts" | wc -l) files<br>
          📊 Total SCSS: $(find src -name "*.scss" | wc -l) files<br>
          📊 Total Templates: $(find src -name "*.html" | wc -l) files<br>
          📊 Lines of Code: $(find src -name "*.ts" -exec cat {} \; | wc -l) LOC
                      </div>
