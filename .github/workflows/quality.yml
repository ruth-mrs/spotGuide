          EOF

      - name: 📤 Upload Frontend Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports-${{ env.REPORT_ID }}
          path: |
            ./frontend/reports/
          retention-days: 30

  # ================================================================
  # 📊 BACKEND QUALITY REPORT
  # ================================================================
  backend-report:
    if: ${{ inputs.report_scope == 'both' || inputs.report_scope == 'backend-only' || inputs.report_scope == '' }}
    runs-on: ubuntu-latest
    name: ⚙️ Backend Quality Report

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017

    outputs:
      coverage-lines: ${{ steps.metrics.outputs.coverage-lines }}
      eslint-issues: ${{ steps.metrics.outputs.eslint-issues }}
      api-response-time: ${{ steps.metrics.outputs.api-response-time }}
      js-files: ${{ steps.metrics.outputs.js-files }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 📁 Create Reports Directory
        working-directory: ./backend
        run: mkdir -p reports

      # ===============================
      # 🔍 CODE ANALYSIS
      # ===============================
      - name: 🔍 ESLint Analysis
        working-directory: ./backend
        continue-on-error: true
        run: |
          echo "🔍 Running ESLint analysis..."
          
          # Create ESLint config if not exists
          if [ ! -f ".eslintrc.js" ]; then
            cat > .eslintrc.js << 'EOF'
          module.exports = {
            env: {
              browser: false,
              commonjs: true,
              es2021: true,
              node: true,
              jest: true
            },
            extends: ['standard'],
            parserOptions: {
              ecmaVersion: 12
            },
            rules: {
              'no-console': 'warn',
              'no-unused-vars': ['error', { 'argsIgnorePattern': '^_' }]
            },
            ignorePatterns: ['node_modules/', 'coverage/', '*.min.js']
          }
          EOF
          fi
          
          # Run ESLint
          npx eslint . --ext .js --format json --output-file reports/eslint-report.json || true
          npx eslint . --ext .js --format html --output-file reports/eslint-report.html || true
          
          # Calculate metrics
          TOTAL_JS_FILES=$(find . -name "*.js" -not -path "./node_modules/*" | wc -l)
          ESLINT_ISSUES=$(cat reports/eslint-report.json | jq '[.[] | .messages[]] | length' 2>/dev/null || echo "0")
          ESLINT_ERRORS=$(cat reports/eslint-report.json | jq '[.[] | .messages[] | select(.severity == 2)] | length' 2>/dev/null || echo "0")
          ESLINT_WARNINGS=$(cat reports/eslint-report.json | jq '[.[] | .messages[] | select(.severity == 1)] | length' 2>/dev/null || echo "0")
          
          echo "js-files=$TOTAL_JS_FILES" >> $GITHUB_OUTPUT
          echo "eslint-issues=$ESLINT_ISSUES" >> $GITHUB_OUTPUT
          echo "eslint-errors=$ESLINT_ERRORS" >> $GITHUB_OUTPUT
          echo "eslint-warnings=$ESLINT_WARNINGS" >> $GITHUB_OUTPUT

      # ===============================
      # 🧪 TESTING & COVERAGE
      # ===============================
      - name: 🧪 Run Tests with Coverage
        working-directory: ./backend
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/spotguide_test
          JWT_SECRET: test_jwt_secret_for_github_actions
        run: |
          echo "🧪 Running unit tests with coverage..."
          
          # Create Jest config if not exists
          if [ ! -f "jest.config.js" ]; then
            cat > jest.config.js << 'EOF'
          module.exports = {
            testEnvironment: 'node',
            collectCoverageFrom: [
              '**/*.js',
              '!**/node_modules/**',
              '!**/coverage/**',
              '!**/*.config.js'
            ],
            coverageDirectory: 'coverage',
            coverageReporters: ['text', 'lcov', 'html', 'json'],
            testTimeout: 30000
          };
          EOF
          fi
          
          # Run tests
          npm test -- --coverage --coverageDirectory=coverage || true
          
          # Copy coverage reports
          if [ -d "coverage" ]; then
            cp -r coverage reports/
            
            # Extract coverage metrics
            if [ -f "coverage/lcov-report/index.html" ]; then
              COVERAGE_LINES=$(grep -o "Lines</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              COVERAGE_FUNCTIONS=$(grep -o "Functions</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              COVERAGE_BRANCHES=$(grep -o "Branches</dt><dd class=\"pct\">[0-9.]*%" coverage/lcov-report/index.html | head -1 | grep -o "[0-9.]*" || echo "0")
              
              echo "coverage-lines=$COVERAGE_LINES" >> $GITHUB_OUTPUT
              echo "coverage-functions=$COVERAGE_FUNCTIONS" >> $GITHUB_OUTPUT
              echo "coverage-branches=$COVERAGE_BRANCHES" >> $GITHUB_OUTPUT
            fi
          fi

      # ===============================
      # ⚡ API PERFORMANCE TEST
      # ===============================
      - name: ⚡ API Performance Test
        working-directory: ./backend
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/spotguide_test
          JWT_SECRET: test_jwt_secret_for_github_actions
          PORT: 3001
        run: |
          echo "⚡ Testing API performance..."
          
          # Start server in background
          npm start &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 15
          
          # Create curl format for metrics
          cat > curl-format.txt << 'EOF'
          {
            "time_total": %{time_total},
            "time_connect": %{time_connect},
            "time_starttransfer": %{time_starttransfer},
            "http_code": %{http_code}
          }
          EOF
          
          # Test endpoints
          curl -w "@curl-format.txt" -o /dev/null -s http://localhost:3001/api/health > reports/perf-health.json || echo '{"error": "endpoint not available"}' > reports/perf-health.json
          
          # Stop server
          kill $SERVER_PID || true
          
          # Extract performance metrics
          HEALTH_TIME=$(cat reports/perf-health.json | jq '.time_total' 2>/dev/null || echo "0")
          HEALTH_TIME_MS=$(echo "$HEALTH_TIME * 1000" | bc 2>/dev/null | cut -d. -f1 || echo "250")
          
          echo "api-response-time=$HEALTH_TIME_MS" >> $GITHUB_OUTPUT

      # ===============================
      # 🔒 SECURITY AUDIT
      # ===============================
      - name: 🔒 Security Audit
        working-directory: ./backend
        continue-on-error: true
        run: |
          echo "🔒 Running security audit..."
          
          npm audit --json > reports/npm-audit.json || true
          npm audit > reports/npm-audit.txt || true
          
          # Count vulnerabilities
          CRITICAL_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          HIGH_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
          MODERATE_VULNS=$(cat reports/npm-audit.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo "0")
          
          echo "security-critical=$CRITICAL_VULNS" >> $GITHUB_OUTPUT
          echo "security-high=$HIGH_VULNS" >> $GITHUB_OUTPUT
          echo "security-moderate=$MODERATE_VULNS" >> $GITHUB_OUTPUT

      # ===============================
      # 📚 API DOCUMENTATION
      # ===============================
      - name: 📚 Generate API Documentation
        working-directory: ./backend
        continue-on-error: true
        run: |
          echo "📚 Generating API documentation..."
          
          # Check if Swagger exists
          if [ -f "swagger.js" ]; then
            node -e "
              try {
                const swaggerSpec = require('./swagger');
                const fs = require('fs');
                fs.writeFileSync('reports/swagger.json', JSON.stringify(swaggerSpec, null, 2));
                console.log('Swagger documentation generated');
              } catch (error) {
                console.log('Error generating Swagger doc:', error.message);
              }
            "
          fi
          
          # Extract API routes
          echo "📍 Detected API Routes:" > reports/api-routes.txt
          find app_api/routes -name "*.js" 2>/dev/null -exec grep -h "router\." {} \; | grep -E "(get|post|put|delete)" | sort | uniq >> reports/api-routes.txt || true

      # ===============================
      # 📊 GENERATE BACKEND REPORT
      # ===============================
      - name: 📊 Generate Backend Quality Report
        id: metrics
        working-directory: ./backend
        run: |
          # Extract all metrics for output
          echo "coverage-lines=${COVERAGE_LINES:-0}" >> $GITHUB_OUTPUT
          echo "eslint-issues=${ESLINT_ISSUES:-0}" >> $GITHUB_OUTPUT
          echo "api-response-time=${HEALTH_TIME_MS:-250}" >> $GITHUB_OUTPUT
          echo "js-files=${TOTAL_JS_FILES:-0}" >> $GITHUB_OUTPUT
          
          cat > reports/backend-quality-report.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>SpotGuide Backend - Quality Report</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { 
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
                      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
                      min-height: 100vh;
                      padding: 20px;
                  }
                  .container { 
                      max-width: 1200px; 
                      margin: 0 auto; 
                      background: white; 
                      border-radius: 16px; 
                      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                      overflow: hidden;
                  }
                  .header { 
                      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); 
                      color: white; 
                      padding: 40px; 
                      text-align: center; 
                  }
                  .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
                  .header .subtitle { opacity: 0.9; font-size: 1.2rem; }
                  .header .meta { margin-top: 20px; opacity: 0.8; }
                  
                  .metrics-grid { 
                      display: grid; 
                      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
                      gap: 20px; 
                      padding: 40px; 
                      background: #f0fdf4;
                  }
                  .metric-card { 
                      background: white; 
                      padding: 30px; 
                      border-radius: 12px; 
                      text-align: center; 
                      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
                      border: 1px solid #dcfce7;
                  }
                  .metric-value { 
                      font-size: 3rem; 
                      font-weight: bold; 
                      margin-bottom: 10px; 
                  }
                  .metric-label { 
                      color: #166534; 
                      font-size: 1.1rem;
                      margin-bottom: 5px;
                  }
                  .metric-description { 
                      color: #22c55e; 
                      font-size: 0.9rem; 
                  }
                  
                  .status-good { color: #16a34a; }
                  .status-warning { color: #eab308; }
                  .status-error { color: #dc2626; }
                  
                  .section { 
                      padding: 40px; 
                      border-bottom: 1px solid #e5e7eb; 
                  }
                  .section h2 { 
                      font-size: 1.8rem; 
                      margin-bottom: 20px; 
                      color: #166534;
                  }
                  .report-links { 
                      display: grid; 
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
                      gap: 15px; 
                  }
                  .report-link { 
                      display: block; 
                      padding: 20px; 
                      background: #f0fdf4; 
                      border: 1px solid #bbf7d0; 
                      border-radius: 8px; 
                      text-decoration: none; 
                      color: #166534; 
                      text-align: center; 
                      transition: all 0.2s ease; 
                  }
                  .report-link:hover { 
                      background: #dcfce7; 
                      border-color: #86efac; 
                      transform: translateY(-2px);
                  }
                  
                  .file-structure { 
                      background: #f9fafb; 
                      padding: 20px; 
                      border-radius: 8px; 
                      font-family: 'Courier New', monospace; 
                      color: #374151;
                      line-height: 1.6;
                  }
                  
                  .api-endpoints { 
                      display: grid; 
                      gap: 10px; 
                  }
                  .api-endpoint { 
                      background: #f0fdf4; 
                      padding: 12px 16px; 
                      border-radius: 6px; 
                      font-family: 'Courier New', monospace; 
                      border-left: 4px solid #22c55e;
                  }
                  
                  .recommendations { 
                      background: #fef3c7; 
                      border: 1px solid #fbbf24; 
                      border-radius: 8px; 
                      padding: 20px; 
                  }
                  .recommendations ul { 
                      list-style: none; 
                      padding: 0; 
                  }
                  .recommendations li { 
                      padding: 8px 0; 
                      border-bottom: 1px solid rgba(251, 191, 36, 0.2); 
                  }
                  .recommendations li:last-child { 
                      border-bottom: none; 
                  }
                  
                  .footer { 
                      text-align: center; 
                      padding: 30px; 
                      color: #6b7280; 
                      background: #f9fafb;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>⚙️ SpotGuide Backend</h1>
                      <div class="subtitle">Quality & Performance Report</div>
                      <div class="meta">
                          📅 Generated: $(date '+%d/%m/%Y %H:%M:%S') | 
                          🔖 Commit: ${GITHUB_SHA:0:7} | 
                          🏗️ Build #${GITHUB_RUN_NUMBER}
                      </div>
                  </div>

                  <div class="metrics-grid">
                      <div class="metric-card">
                          <div class="metric-value status-warning">${COVERAGE_LINES:-0}%</div>
                          <div class="metric-label">Test Coverage</div>
                          <div class="metric-description">Lines covered by tests</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${ESLINT_ISSUES:-0 == 0 ? 'status-good' : ESLINT_ISSUES < 10 ? 'status-warning' : 'status-error'}">${ESLINT_ISSUES:-0}</div>
                          <div class="metric-label">ESLint Issues</div>
                          <div class="metric-description">${ESLINT_ERRORS:-0} errors, ${ESLINT_WARNINGS:-0} warnings</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${HEALTH_TIME_MS:-250 < 300 ? 'status-good' : HEALTH_TIME_MS < 500 ? 'status-warning' : 'status-error'}">${HEALTH_TIME_MS:-250}ms</div>
                          <div class="metric-label">API Response Time</div>
                          <div class="metric-description">Health endpoint response</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value status-good">${TOTAL_JS_FILES:-0}</div>
                          <div class="metric-label">JavaScript Files</div>
                          <div class="metric-description">Total source files</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value ${CRITICAL_VULNS:-0 == 0 ? 'status-good' : 'status-error'}">${CRITICAL_VULNS:-0}</div>
                          <div class="metric-label">Critical Vulnerabilities</div>
                          <div class="metric-description">${HIGH_VULNS:-0} high, ${MODERATE_VULNS:-0} moderate</div>
                      </div>
                      
                      <div class="metric-card">
                          <div class="metric-value status-good">$(find . -name "*.js" -not -path "./node_modules/*" -not -path "./coverage/*" -exec cat {} \; | wc -l)</div>
                          <div class="metric-label">Lines of Code</div>
                          <div class="metric-description">Total LOC in project</div>
                      </div>
                  </div>

                  <div class="section">
                      <h2>📁 Project Structure</h2>
                      <div class="file-structure">
          backend/<br>
          ├── 📁 app_api/<br>
          │   ├── 📁 controllers/ ($(find app_api/controllers -name "*.js" 2>/dev/null | wc -l) files)<br>
          │   ├── 📁 models/ ($(find app_api/models -name "*.js" 2>/dev/null | wc -l) files)<br>
          │   ├── 📁 routes/ ($(find app_api/routes -name "*.js" 2>/dev/null | wc -l) files)<br>
          │   └── 📁 middleware/ ($(find app_api/middleware -name "*.js" 2>/dev/null | wc -l) files)<br>
          ├── 📁 scripts/ ($(find scripts -name "*.js" 2>/dev/null | wc -l) files)<br>
          ├── 📁 services/ ($(find services -name "*.js" 2>/dev/null | wc -l) files)<br>
          └── 📁 tests/ ($(find tests -name "*.js" 2>/dev/null | wc -l) files)<br>
          <br>
          📊 Total JavaScript: ${TOTAL_JS_FILES:-0} files<br>
          📊 Lines of Code: $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./coverage/*" -exec cat {} \; | wc -l) LOC<br>
          📊 Configuration Files: $(find . -name "*.json" -not -path "./node_modules/*" | wc -l)
                      </div>
                  </div>

                  <div class="section">
                      <h2>🚀 API Endpoints</h2>
                      <div class="api-endpoints">
                          <div class="api-endpoint">GET /api/health</div>
                          <div class="api-endpoint">POST /api/auth/login</div>
                          <div class="api-endpoint">POST /api/auth/register</div>
                          <div class="api-endpoint">GET /api/pois</div>
                          <div class="api-endpoint">POST /api/custom-pois</div>
                          <div class="api-endpoint">GET /api/favorites</div>
                          <div class="api-endpoint">GET /api/routes/generate</div>
                      </div>
                  </div>

                  <div class="section">
                      <h2>📊 Detailed Reports</h2>
                      <div class="report-links">
                          <a href="eslint-report.html" class="report-link">🔍 ESLint Analysis</a>
                          <a href="coverage/lcov-report/index.html" class="report-link">🧪 Test Coverage</a>
                          <a href="npm-audit.txt" class="report-link">🔒 Security Audit</a>
                          <a href="swagger.json" class="report-link">📚 API Documentation</a>
                          <a href="api-routes.txt" class="report-link">🚀 API Routes</a>
                          <a href="perf-health.json" class="report-link">⚡ Performance Data</a>
                      </div>
                  </div>

                  <div class="section">
                      <h2>💡 Improvement Recommendations</h2>
                      <div class="recommendations">
                          <ul>
                              <li>🧪 <strong>Testing:</strong> Increase coverage from ${COVERAGE_LINES:-0}% to 70%</li>
                              <li>🔒 <strong>Security:</strong> Implement rate limiting and input validation</li>
                              <li>📊 <strong>Monitoring:</strong> Add real-time performance metrics</li>
                              <li>🔍 <strong>Code Quality:</strong> Fix ${ESLINT_ISSUES:-0} ESLint issues</li>
                              <li>📚 <strong>Documentation:</strong> Complete API documentation with Swagger</li>
                              <li>🛡️ <strong>Dependencies:</strong> Update packages with vulnerabilities</li>
                              <li>⚡ <strong>Performance:</strong> Implement caching for frequent queries</li>
                          </ul>
                      </div>
                  </div>

                  <div class="footer">
                      Generated automatically by GitHub Actions • SpotGuide Quality System
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: 📤 Upload Backend Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports-${{ env.REPORT_ID }}
          path: |
            ./backend/reports/
          retention-days: 30

  # ================================================================
  # 📊 CONSOLIDATED DASHBOARD
  # ================================================================
  generate-dashboard:
    if: always()
    runs-on: ubuntu-latest
    name: 📊 Generate Quality Dashboard
    needs: [frontend-report, backend-report]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Frontend Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-reports-${{ env.REPORT_ID }}
          path: ./reports/frontend

      - name: 📥 Download Backend Reports  
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-reports-${{ env.REPORT_ID }}
          path: ./reports/backend

      - name: 📊 Create Quality Dashboard
        run: |
          mkdir -p reports
          
          cat > reports/index.html << 'EOF'
          echo "- [🚀 SpotGuide Application](https://ruth-mrs.github.io/spotGuide/)" >> $GITHUB_STEP_SUMMARY
          echo "- [📂 GitHub Repository](https://github.com/Ruth-MRS/spotGuide)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review quality reports and fix critical issues" >> $GITHUB_STEP_SUMMARY
          echo "2. Increase test coverage to meet project standards" >> $GITHUB_STEP_SUMMARY
          echo "3. Address security vulnerabilities in dependencies" >> $GITHUB_STEP_SUMMARY
          echo "4. Optimize bundle sizes and performance metrics" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Create Status Badge
        if: github.ref == 'refs/heads/main'
        run: |
          # Create quality status badge
          FRONTEND_COVERAGE="${{ needs.frontend-report.outputs.coverage-lines || '0' }}"
          BACKEND_COVERAGE="${{ needs.backend-report.outputs.coverage-lines || '0' }}"
          OVERALL_COVERAGE=$(( (FRONTEND_COVERAGE + BACKEND_COVERAGE) / 2 ))
          
          if [ $OVERALL_COVERAGE -ge 70 ]; then
            BADGE_COLOR="brightgreen"
            BADGE_STATUS="excellent"
          elif [ $OVERALL_COVERAGE -ge 50 ]; then
            BADGE_COLOR="yellow"
            BADGE_STATUS="good"
          else
            BADGE_COLOR="red"
            BADGE_STATUS="needs-improvement"
          fi
          
          echo "📊 Overall Quality Score: $OVERALL_COVERAGE%" >> $GITHUB_STEP_SUMMARY
          echo "🏆 Status: $BADGE_STATUS" >> $GITHUB_STEP_SUMMARY

      - name: 📧 Notify on Quality Issues
        if: always() && (needs.frontend-report.outputs.eslint-issues > 20 || needs.backend-report.outputs.eslint-issues > 20)
        run: |
          echo "⚠️ **QUALITY ALERT**: High number of code quality issues detected!" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend ESLint Issues: ${{ needs.frontend-report.outputs.eslint-issues || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend ESLint Issues: ${{ needs.backend-report.outputs.eslint-issues || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Consider running \`npm run lint:fix\` to auto-fix issues" >> $GITHUB_STEP_SUMMARY