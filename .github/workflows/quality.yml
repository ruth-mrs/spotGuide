                  }
                  .header { 
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                      color: white; 
                      padding: 40px; 
                      text-align: center; 
                  }
                  .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
                  .header .subtitle { opacity: 0.9; font-size: 1.2rem; }
                  .header .meta { margin-top: 20px; opacity: 0.8; }
                  
                  .metrics-grid { 
                      display: grid; 
                      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
                      gap: 20px; 
                      padding: 40px; 
                      background: #f8fafc;
                  }
                  .metric-card { 
                      background: white; 
                      padding: 30px; 
                      border-radius: 12px; 
                      text-align: center; 
                      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
                      border: 1px solid #e2e8f0;
                  }
                  .metric-value { 
                      font-size: 3rem; 
                      font-weight: bold; 
                      margin-bottom: 10px; 
                  }
                  .metric-label { 
                      color: #64748b; 
                      font-size: 1.1rem;
                      margin-bottom: 5px;
                  }
                  .metric-description { 
                      color: #94a3b8; 
                      font-size: 0.9rem; 
                  }
                  
                  .status-good { color: #10b981; }
                  .status-warning { color: #f59e0b; }
                  .status-error { color: #ef4444; }
                  
                  .section { 
                      padding: 40px; 
                      border-bottom: 1px solid #e2e8f0; 
                  }
                  .section h2 { 
                      font-size: 1.8rem; 
                      margin-bottom: 20px; 
                      color: #1e293b;
                  }
                  .report-links { 
                      display: grid; 
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
                      gap: 15px; 
                  }
                  .report-link { 
                      display: block; 
                      padding: 20px; 
                      background: #f1f5f9; 
                      border: 1px solid #e2e8f0; 
                      border-radius: 8px; 
                      text-decoration: none; 
                      color: #475569; 
                      text-align: center; 
                      transition: all 0.2s ease; 
                  }
                  .report-link:hover { 
                      background: #e2e8f0; 
                      border-color: #cbd5e1; 
                      transform: translateY(-2px);
                  }
                  
                  .file-structure { 
                      background: #f8fafc; 
                      padding: 20px; 
                      border-radius: 8px; 
                      font-family: 'Courier New', monospace; 
                      color: #334155;
                      line-height: 1.6;
                  }
                  
                  .recommendations { 
                      background: #fef3c7; 
                      border: 1px solid #fbbf24; 
                      border-radius: 8px; 
