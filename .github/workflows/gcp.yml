name: Build and Push Docker Images to Google Container Registry

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-gcr.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCR_REGION: gcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ env.GCR_REGION }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.GCR_REGION }}/${{ env.PROJECT_ID }}/backend:0.1 ./backend
          docker push ${{ env.GCR_REGION }}/${{ env.PROJECT_ID }}/backend:0.1

      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.GCR_REGION }}/${{ env.PROJECT_ID }}/frontend:0.1 ./frontend
          docker push ${{ env.GCR_REGION }}/${{ env.PROJECT_ID }}/frontend:0.1