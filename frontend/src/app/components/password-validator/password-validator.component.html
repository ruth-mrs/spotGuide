@if (showValidator) {
  <div class="password-validation">
    <div class="validation-item" [class.valid]="checks.length">
      <ion-icon [name]="checks.length ? 'checkmark-circle' : 'close-circle'"></ion-icon>
      <span>Mínimo 8 caracteres</span>
    </div>
    <div class="validation-item" [class.valid]="checks.uppercase">
      <ion-icon [name]="checks.uppercase ? 'checkmark-circle' : 'close-circle'"></ion-icon>
      <span>Al menos una mayúscula</span>
    </div>
    <div class="validation-item" [class.valid]="checks.lowercase">
      <ion-icon [name]="checks.lowercase ? 'checkmark-circle' : 'close-circle'"></ion-icon>
      <span>Al menos una minúscula</span>
    </div>
    <div class="validation-item" [class.valid]="checks.number">
      <ion-icon [name]="checks.number ? 'checkmark-circle' : 'close-circle'"></ion-icon>
      <span>Al menos un número</span>
    </div>
  </div>
}
